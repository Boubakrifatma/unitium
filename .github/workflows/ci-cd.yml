name: CI/CD — Build, Push & Deploy

on:
  push:
    branches:
      - dockerize-k8s-module2

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/piprojet-frontend
  BACKEND_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/piprojet-backend
  ML_IMAGE:       ${{ secrets.DOCKERHUB_USERNAME }}/piprojet-ml-service

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Build all Docker images and push to DockerHub
  # Runs on GitHub's free cloud runners (no local machine needed)
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.sha-short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: meta
        run: echo "sha-short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Frontend ──────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Pi_ProjetFront
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha-short }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to:   type=inline

      # ── Backend ───────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Pi_Projet
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha-short }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:latest
          cache-to:   type=inline

      # ── ML Service ────────────────────────────────────────────
      - name: Build & push ML service
        uses: docker/build-push-action@v5
        with:
          context: ./m2_ml_service
          push: true
          tags: |
            ${{ env.ML_IMAGE }}:latest
            ${{ env.ML_IMAGE }}:${{ steps.meta.outputs.sha-short }}
          cache-from: type=registry,ref=${{ env.ML_IMAGE }}:latest
          cache-to:   type=inline

  # ──────────────────────────────────────────────────────────────
  # Job 2: Tell Kubernetes to pull the new images and redeploy
  # Runs on the self-hosted runner installed on Fatma's VM
  # (the VM already has kubectl + access to the local cluster)
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted          # <-- your VM's runner label
    needs: build-and-push
    if: success()

    env:
      TAG: ${{ needs.build-and-push.outputs.image-tag }}

    steps:
      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ secrets.DOCKERHUB_USERNAME }}/piprojet-frontend:${{ env.TAG }} \
            --record

      - name: Update backend image
        run: |
          kubectl set image deployment/backend \
            backend=${{ secrets.DOCKERHUB_USERNAME }}/piprojet-backend:${{ env.TAG }} \
            --record

      - name: Update ML service image
        run: |
          kubectl set image deployment/m2-ml-service \
            m2-ml-service=${{ secrets.DOCKERHUB_USERNAME }}/piprojet-ml-service:${{ env.TAG }} \
            --record

      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/frontend   --timeout=120s
          kubectl rollout status deployment/backend    --timeout=180s
          kubectl rollout status deployment/m2-ml-service --timeout=120s

      - name: Verify pods are running
        run: kubectl get pods -l "app in (frontend,backend,m2-ml-service)"
