name: CI/CD — Build, Push & Deploy

on:
  push:
    branches:
      - dockerize-k8s-module2

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/piprojet-frontend
  BACKEND_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/piprojet-backend
  ML_IMAGE:       ${{ secrets.DOCKERHUB_USERNAME }}/piprojet-ml-service

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Build all Docker images and push to DockerHub
  # Runs on GitHub's free cloud runners (no local machine needed)
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.sha-short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: meta
        run: echo "sha-short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Frontend ──────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Pi_ProjetFront
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha-short }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to:   type=inline

      # ── Backend ───────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Pi_Projet
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha-short }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:latest
          cache-to:   type=inline

      # ── ML Service ────────────────────────────────────────────
      - name: Build & push ML service
        uses: docker/build-push-action@v5
        with:
          context: ./m2_ml_service
          push: true
          tags: |
            ${{ env.ML_IMAGE }}:latest
            ${{ env.ML_IMAGE }}:${{ steps.meta.outputs.sha-short }}
          cache-from: type=registry,ref=${{ env.ML_IMAGE }}:latest
          cache-to:   type=inline

  # ──────────────────────────────────────────────────────────────
  # Job 2: Deploy to Kubernetes cluster
  # Runs on the self-hosted runner installed on your machine
  # (the VM already has kubectl + access to the local K8s cluster)
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build-and-push
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: |
          echo "Applying Kubernetes manifests to piprojet namespace..."
          kubectl apply -f k8s/ --insecure-skip-tls-verify=true

      - name: Wait for frontend rollout
        run: |
          echo "Waiting for frontend deployment to rollout..."
          kubectl rollout status deployment/frontend -n piprojet --timeout=120s --insecure-skip-tls-verify=true

      - name: Wait for backend rollout
        run: |
          echo "Waiting for backend deployment to rollout..."
          kubectl rollout status deployment/backend -n piprojet --timeout=180s --insecure-skip-tls-verify=true

      - name: Wait for ML service rollout
        run: |
          echo "Waiting for ML service deployment to rollout..."
          kubectl rollout status deployment/m2-ml-service -n piprojet --timeout=120s --insecure-skip-tls-verify=true

      - name: Verify pods are running
        run: |
          echo "Verifying all pods in piprojet namespace..."
          kubectl get pods -n piprojet --insecure-skip-tls-verify=true
          echo "---"
          echo "Checking deployment status..."
          kubectl get deployments -n piprojet --insecure-skip-tls-verify=true
          echo "---"
          echo "Checking services..."
          kubectl get svc -n piprojet --insecure-skip-tls-verify=true
