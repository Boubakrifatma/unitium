name: Code Quality (No Token Required)

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    name: PMD + Checkstyle + SpotBugs + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      # Run all quality tools + tests
      - name: Run quality analysis
        working-directory: Pi_Projet
        run: |
          mvn verify \
            pmd:pmd pmd:cpd \
            checkstyle:checkstyle \
            spotbugs:spotbugs \
            jacoco:report \
            -DskipTests=false

      # Upload reports as artifacts (accessible without any token)
      - name: Upload PMD report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmd-report
          path: Pi_Projet/target/pmd.xml

      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-report
          path: Pi_Projet/target/checkstyle-result.xml

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: Pi_Projet/target/spotbugsXml.xml

      - name: Upload Coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: Pi_Projet/target/site/jacoco/

      # Show a summary directly in the GitHub Actions UI
      - name: Print quality summary
        if: always()
        working-directory: Pi_Projet
        run: |
          echo "## PMD Violations" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -c '<violation' target/pmd.xml 2>/dev/null \
            && echo "violations found" >> $GITHUB_STEP_SUMMARY \
            || echo "0 violations" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "## Checkstyle Errors" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -c '<error' target/checkstyle-result.xml 2>/dev/null \
            || echo "0 errors" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "## SpotBugs Bugs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -c '<BugInstance' target/spotbugsXml.xml 2>/dev/null \
            || echo "0 bugs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
