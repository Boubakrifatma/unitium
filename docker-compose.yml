services:

  # MySQL
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: PiProjet123
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Module 2 ML Service
  m2_ml_service:
    build:
      context: ./m2_ml_service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./m2_ml_service/models:/app/models
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: PiProjet123
      DB_USER: root
      DB_PASS: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Spring Boot Backend
  backend:
    build:
      context: ./Pi_Projet
    depends_on:
      mysql:
        condition: service_healthy
      m2_ml_service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/PiProjet123?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      ML_SERVICE_BASE_URL: ${ML_SERVICE_BASE_URL:-http://m2_ml_service:8000}
    ports:
      - "8084:8084"

  # Angular Frontend (nginx)
  frontend:
    build:
      context: ./Pi_ProjetFront
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
