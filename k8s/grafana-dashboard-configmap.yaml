apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-piprojet
  namespace: monitoring
data:
  piprojet-health.json: |
    {
      "title": "PiProjet App Health Status",
      "tags": ["piprojet", "health", "monitoring"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 0,
      "refresh": "10s",
      "uid": "piprojet-health",
        "panels": [
          {
            "id": 1,
            "title": "Backend Service Health",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "up{job=\"piprojet-backend\"}",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "justifyMode": "center",
              "textMode": "auto",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "red", "value": 0},
                  {"color": "green", "value": 1}
                ]
              }
            },
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "0": {"text": "DOWN", "color": "red"},
                      "1": {"text": "UP", "color": "green"}
                    }
                  }
                ],
                "custom": {}
              }
            }
          },
          {
            "id": 2,
            "title": "ML Service Health",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "targets": [
              {
                "expr": "up{job=\"piprojet-ml-service\"}",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "justifyMode": "center",
              "textMode": "auto",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "red", "value": 0},
                  {"color": "green", "value": 1}
                ]
              }
            },
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  {
                    "type": "value",
                    "options": {
                      "0": {"text": "DOWN", "color": "red"},
                      "1": {"text": "UP", "color": "green"}
                    }
                  }
                ],
                "custom": {}
              }
            }
          },
          {
            "id": 3,
            "title": "Backend Request Rate (5m)",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "rate(http_requests_total{job=\"piprojet-backend\"}[5m])",
                "legendFormat": "{{ method }} {{ path }}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 4,
            "title": "Backend Error Rate (5m)",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "rate(http_requests_total{job=\"piprojet-backend\", status=~\"5..\"}[5m])",
                "legendFormat": "{{ method }} {{ path }}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 5,
            "title": "Backend Response Time (p95)",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"piprojet-backend\"}[5m]))",
                "legendFormat": "{{ method }} {{ path }}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 6,
            "title": "ML Service Response Time",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "targets": [
              {
                "expr": "rate(http_request_duration_seconds_sum{job=\"piprojet-ml-service\"}[5m])",
                "legendFormat": "{{ method }} {{ path }}",
                "refId": "A"
              }
            ]
          }
        ]
    }
