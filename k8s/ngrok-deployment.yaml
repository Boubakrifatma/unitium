apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok
  namespace: piprojet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngrok
  template:
    metadata:
      labels:
        app: ngrok
    spec:
      serviceAccountName: ngrok
      containers:
        - name: ngrok
          image: ngrok/ngrok:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              ngrok http frontend:80 --log=stdout --region=eu
          env:
            - name: NGROK_AUTHTOKEN
              valueFrom:
                secretKeyRef:
                  name: ngrok-secret
                  key: authtoken
          ports:
            - containerPort: 4040
              name: mgmt
          readinessProbe:
            httpGet:
              path: /api/status
              port: 4040
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: 4040
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ngrok
  namespace: piprojet
spec:
  type: ClusterIP
  selector:
    app: ngrok
  ports:
    - name: management
      port: 4040
      targetPort: 4040
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ngrok
  namespace: piprojet
