apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-piprojet
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  piprojet-dashboard.json: |
    {
      "title": "PiProjet Monitoring",
      "uid": "piprojet-main",
      "timezone": "browser",
      "refresh": "10s",
      "panels": [
        {"id":1,"title":"Pods Running","type":"stat","gridPos":{"x":0,"y":0,"w":4,"h":4},"targets":[{"expr":"count(kube_pod_status_phase{namespace='piprojet',phase='Running'})","legendFormat":"Running"}],"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"red","value":0},{"color":"green","value":4}]}}}},
        {"id":2,"title":"Pod Restarts","type":"stat","gridPos":{"x":4,"y":0,"w":4,"h":4},"targets":[{"expr":"sum(kube_pod_container_status_restarts_total{namespace='piprojet'})","legendFormat":"Restarts"}],"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"green","value":0},{"color":"orange","value":5},{"color":"red","value":10}]}}}},
        {"id":3,"title":"Memory Total MB","type":"stat","gridPos":{"x":8,"y":0,"w":4,"h":4},"targets":[{"expr":"sum(container_memory_working_set_bytes{namespace='piprojet',container!=''})/1024/1024","legendFormat":"MB"}],"fieldConfig":{"defaults":{"unit":"MB"}}},
        {"id":4,"title":"CPU Total","type":"stat","gridPos":{"x":12,"y":0,"w":4,"h":4},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{namespace='piprojet',container!=''}[5m]))","legendFormat":"Cores"}],"fieldConfig":{"defaults":{"unit":"short","decimals":3}}},
        {"id":5,"title":"Deployment Replicas Available","type":"bargauge","gridPos":{"x":0,"y":4,"w":12,"h":6},"targets":[{"expr":"kube_deployment_status_replicas_available{namespace='piprojet'}","legendFormat":"{{deployment}}"}],"options":{"orientation":"horizontal","displayMode":"gradient"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"red","value":0},{"color":"green","value":1}]}}}},
        {"id":6,"title":"Pod Restarts par Container","type":"bargauge","gridPos":{"x":12,"y":4,"w":12,"h":6},"targets":[{"expr":"kube_pod_container_status_restarts_total{namespace='piprojet'}","legendFormat":"{{pod}}"}],"options":{"orientation":"horizontal","displayMode":"gradient"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"steps":[{"color":"green","value":0},{"color":"orange","value":3},{"color":"red","value":5}]}}}},
        {"id":7,"title":"CPU Usage par Pod","type":"timeseries","gridPos":{"x":0,"y":10,"w":12,"h":8},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{namespace='piprojet',container!=''}[5m])) by (pod)","legendFormat":"{{pod}}"}]},
        {"id":8,"title":"Memory Usage par Pod MB","type":"timeseries","gridPos":{"x":12,"y":10,"w":12,"h":8},"targets":[{"expr":"sum(container_memory_working_set_bytes{namespace='piprojet',container!=''}) by (pod)/1024/1024","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"MB"}}},
        {"id":9,"title":"Network RX par Pod","type":"timeseries","gridPos":{"x":0,"y":18,"w":12,"h":8},"targets":[{"expr":"sum(rate(container_network_receive_bytes_total{namespace='piprojet'}[5m])) by (pod)","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"Bps"}}},
        {"id":10,"title":"Network TX par Pod","type":"timeseries","gridPos":{"x":12,"y":18,"w":12,"h":8},"targets":[{"expr":"sum(rate(container_network_transmit_bytes_total{namespace='piprojet'}[5m])) by (pod)","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"Bps"}}}
      ],
      "time":{"from":"now-3h","to":"now"},
      "schemaVersion":38
    }
