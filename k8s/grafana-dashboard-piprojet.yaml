apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-piprojet
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  piprojet-dashboard.json: |
    {
      "title": "PiProjet Monitoring",
      "uid": "piprojet-main",
      "timezone": "browser",
      "refresh": "10s",
      "tags": ["piprojet", "kubernetes"],
      "panels": [
        {
          "id": 1,
          "title": "🟢 Pods Running",
          "type": "stat",
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "count(kube_pod_status_phase{namespace='piprojet', phase='Running'})", "legendFormat": "Running"}],
          "options": {"colorMode": "background", "textMode": "auto", "graphMode": "area"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "red", "value": 0}, {"color": "orange", "value": 3}, {"color": "green", "value": 6}]}}}
        },
        {
          "id": 2,
          "title": "⚠️ Pods con Problemas",
          "type": "stat",
          "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "count(kube_pod_status_phase{namespace='piprojet', phase!='Running'}) or vector(0)", "legendFormat": "Issues"}],
          "options": {"colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 1}, {"color": "red", "value": 2}]}}}
        },
        {
          "id": 3,
          "title": "🔄 Total Restarts",
          "type": "stat",
          "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "sum(kube_pod_container_status_restarts_total{namespace='piprojet'})", "legendFormat": "Restarts"}],
          "options": {"colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 5}, {"color": "red", "value": 10}]}}}
        },
        {
          "id": 4,
          "title": "💾 Memory Total (MB)",
          "type": "stat",
          "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace='piprojet', container!=''}) / 1024 / 1024", "legendFormat": "MB"}],
          "options": {"colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "MB", "color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 1000}, {"color": "red", "value": 2000}]}}}
        },
        {
          "id": 5,
          "title": "⚡ CPU Total (cores)",
          "type": "stat",
          "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace='piprojet', container!=''}[5m]))", "legendFormat": "Cores"}],
          "options": {"colorMode": "background"},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 3, "color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 1}, {"color": "red", "value": 2}]}}}
        },
        {
          "id": 6,
          "title": "🌐 Network RX Total",
          "type": "stat",
          "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "sum(rate(container_network_receive_bytes_total{namespace='piprojet'}[5m]))", "legendFormat": "RX"}],
          "options": {"colorMode": "value"},
          "fieldConfig": {"defaults": {"unit": "Bps"}}
        },
        {
          "id": 7,
          "title": "📊 Deployment Replicas Available",
          "type": "bargauge",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 6},
          "targets": [{"expr": "kube_deployment_status_replicas_available{namespace='piprojet'}", "legendFormat": "{{deployment}}"}],
          "options": {"orientation": "horizontal", "displayMode": "gradient"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "red", "value": 0}, {"color": "orange", "value": 1}, {"color": "green", "value": 2}]}, "min": 0, "max": 3}}
        },
        {
          "id": 8,
          "title": "🔁 Pod Restarts par Container",
          "type": "bargauge",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 6},
          "targets": [{"expr": "kube_pod_container_status_restarts_total{namespace='piprojet'}", "legendFormat": "{{pod}}"}],
          "options": {"orientation": "horizontal", "displayMode": "gradient"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 3}, {"color": "red", "value": 5}]}, "min": 0}}
        },
        {
          "id": 9,
          "title": "⚡ CPU Usage par Pod",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 10, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace='piprojet', container!=''}[5m])) by (pod)", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"lineWidth": 2, "fillOpacity": 10}}}
        },
        {
          "id": 10,
          "title": "💾 Memory Usage par Pod (MB)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 10, "w": 12, "h": 8},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace='piprojet', container!=''}) by (pod) / 1024 / 1024", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "MB", "custom": {"lineWidth": 2, "fillOpacity": 10}}}
        },
        {
          "id": 11,
          "title": "🌐 Network RX par Pod",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 18, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(container_network_receive_bytes_total{namespace='piprojet'}[5m])) by (pod)", "legendFormat": "{{pod}} RX"}],
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"lineWidth": 2, "fillOpacity": 10}}}
        },
        {
          "id": 12,
          "title": "🌐 Network TX par Pod",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 18, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(container_network_transmit_bytes_total{namespace='piprojet'}[5m])) by (pod)", "legendFormat": "{{pod}} TX"}],
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"lineWidth": 2, "fillOpacity": 10}}}
        },
        {
          "id": 13,
          "title": "📋 Pod Status Table",
          "type": "table",
          "gridPos": {"x": 0, "y": 26, "w": 24, "h": 8},
          "targets": [
            {"expr": "kube_pod_status_phase{namespace='piprojet'}", "legendFormat": "{{pod}} - {{phase}}", "instant": true},
            {"expr": "kube_pod_container_status_restarts_total{namespace='piprojet'}", "legendFormat": "{{pod}} restarts", "instant": true}
          ],
          "options": {"sortBy": [{"desc": true, "displayName": "Value"}]}
        }
      ],
      "templating": {"list": []},
      "time": {"from": "now-3h", "to": "now"},
      "schemaVersion": 38
    }
