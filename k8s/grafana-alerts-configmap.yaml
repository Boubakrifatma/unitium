apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: monitoring
data:
  alert-rules.yaml: |
    groups:
      - name: piprojet-alerts
        interval: 30s
        rules:
          - alert: BackendServiceDown
            expr: up{job="piprojet-backend"} == 0
            for: 2m
            annotations:
              summary: "Backend service is down"
              description: "Backend service has been down for more than 2 minutes"

          - alert: MLServiceDown
            expr: up{job="piprojet-ml-service"} == 0
            for: 2m
            annotations:
              summary: "ML service is down"
              description: "ML service has been down for more than 2 minutes"

          - alert: HighErrorRate
            expr: rate(http_requests_total{job="piprojet-backend", status=~"5.."}[5m]) > 0.05
            for: 5m
            annotations:
              summary: "High error rate on backend"
              description: "Error rate is above 5% for the last 5 minutes"

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="piprojet-backend"}[5m])) > 1
            for: 5m
            annotations:
              summary: "High latency detected"
              description: "p95 response time is above 1 second"
