apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ============================================
# PROMETHEUS RBAC
# ============================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
# ============================================
# KUBE-STATE-METRICS RBAC
# ============================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints, persistentvolumeclaims, persistentvolumes, namespaces, replicationcontrollers, resourcequotas, secrets, configmaps]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
# ============================================
# PROMETHEUS CONFIG
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: 'node-exporter'
            action: keep

      - job_name: 'cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
# ============================================
# PROMETHEUS DEPLOYMENT
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {}
---
# ============================================
# PROMETHEUS SERVICE
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
---
# ============================================
# KUBE-STATE-METRICS DEPLOYMENT
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.1
          ports:
            - containerPort: 8080
              name: metrics
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
# ============================================
# KUBE-STATE-METRICS SERVICE
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
---
# ============================================
# NODE EXPORTER DAEMONSET
# ============================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:latest
          args:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)"
          ports:
            - containerPort: 9100
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
      tolerations:
        - effect: NoSchedule
          operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  clusterIP: None
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
# ============================================
# GRAFANA DATASOURCE
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
---
# ============================================
# GRAFANA DASHBOARD PROVISIONING
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: piprojet
        orgId: 1
        folder: PiProjet
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
# ============================================
# GRAFANA ALERT RULES
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: monitoring
data:
  alert-rules.yaml: |
    apiVersion: 1
    groups: []
---
# ============================================
# GRAFANA DASHBOARD - FANTASTIC
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-piprojet
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  piprojet-dashboard.json: |
    {
      "title": "PiProjet - Production Monitoring",
      "uid": "piprojet-main",
      "description": "Real-time monitoring for PiProjet Kubernetes deployment",
      "timezone": "browser",
      "refresh": "10s",
      "tags": ["piprojet", "kubernetes", "production"],
      "style": "dark",
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "title": "🟢 Pods Running",
          "type": "stat",
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "count(kube_pod_status_phase{namespace=\"piprojet\",phase=\"Running\"})", "legendFormat": "Running", "datasource": "Prometheus"}],
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "center", "textMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": 0}, {"color": "orange", "value": 3}, {"color": "green", "value": 6}]}, "mappings": [], "unit": "short"}}
        },
        {
          "id": 2,
          "title": "⚠️ Pods with Issues",
          "type": "stat",
          "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "count(kube_pod_status_phase{namespace=\"piprojet\",phase!=\"Running\"}) or vector(0)", "legendFormat": "Issues", "datasource": "Prometheus"}],
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 1}, {"color": "red", "value": 2}]}, "unit": "short"}}
        },
        {
          "id": 3,
          "title": "🔄 Total Restarts",
          "type": "stat",
          "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "sum(kube_pod_container_status_restarts_total{namespace=\"piprojet\"})", "legendFormat": "Restarts", "datasource": "Prometheus"}],
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 5}, {"color": "red", "value": 10}]}, "unit": "short"}}
        },
        {
          "id": 4,
          "title": "💾 Memory Used",
          "type": "stat",
          "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"piprojet\",container!=\"\"})/1024/1024", "legendFormat": "MB", "datasource": "Prometheus"}],
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 1500}, {"color": "red", "value": 3000}]}, "unit": "MB", "decimals": 0}}
        },
        {
          "id": 5,
          "title": "⚡ CPU Usage",
          "type": "stat",
          "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"piprojet\",container!=\"\"}[5m])) * 1000", "legendFormat": "millicores", "datasource": "Prometheus"}],
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 1000}, {"color": "red", "value": 2000}]}, "unit": "short", "decimals": 0}}
        },
        {
          "id": 6,
          "title": "🌐 Network In",
          "type": "stat",
          "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "targets": [{"expr": "sum(rate(container_network_receive_bytes_total{namespace=\"piprojet\"}[5m]))", "legendFormat": "RX", "datasource": "Prometheus"}],
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "Bps", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": 0}]}}}
        },
        {
          "id": 7,
          "title": "📊 Deployment Health",
          "type": "bargauge",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 7},
          "targets": [{"expr": "kube_deployment_status_replicas_available{namespace=\"piprojet\"}", "legendFormat": "{{deployment}}", "datasource": "Prometheus"}],
          "options": {"orientation": "horizontal", "displayMode": "lcd", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": 0}, {"color": "orange", "value": 1}, {"color": "green", "value": 2}]}, "min": 0, "max": 3, "unit": "short"}}
        },
        {
          "id": 8,
          "title": "🔁 Container Restarts",
          "type": "bargauge",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 7},
          "targets": [{"expr": "kube_pod_container_status_restarts_total{namespace=\"piprojet\"} > 0", "legendFormat": "{{container}}", "datasource": "Prometheus"}],
          "options": {"orientation": "horizontal", "displayMode": "gradient", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}, {"color": "yellow", "value": 2}, {"color": "orange", "value": 5}, {"color": "red", "value": 10}]}, "min": 0, "unit": "short"}}
        },
        {
          "id": 9,
          "title": "⚡ CPU Usage per Pod",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 11, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"piprojet\",container!=\"\"}[5m])) by (pod) * 1000", "legendFormat": "{{pod}}", "datasource": "Prometheus"}],
          "options": {"tooltip": {"mode": "multi"}, "legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"lineWidth": 2, "fillOpacity": 15, "gradientMode": "opacity", "spanNulls": false}, "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 10,
          "title": "💾 Memory per Pod (MB)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 11, "w": 12, "h": 8},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"piprojet\",container!=\"\"}) by (pod) / 1024 / 1024", "legendFormat": "{{pod}}", "datasource": "Prometheus"}],
          "options": {"tooltip": {"mode": "multi"}, "legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}},
          "fieldConfig": {"defaults": {"unit": "MB", "custom": {"lineWidth": 2, "fillOpacity": 15, "gradientMode": "opacity"}, "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 11,
          "title": "🌐 Network RX per Pod",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 19, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(container_network_receive_bytes_total{namespace=\"piprojet\"}[5m])) by (pod)", "legendFormat": "{{pod}}", "datasource": "Prometheus"}],
          "options": {"tooltip": {"mode": "multi"}, "legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}},
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"lineWidth": 2, "fillOpacity": 15, "gradientMode": "opacity"}, "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 12,
          "title": "🌐 Network TX per Pod",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 19, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"piprojet\"}[5m])) by (pod)", "legendFormat": "{{pod}}", "datasource": "Prometheus"}],
          "options": {"tooltip": {"mode": "multi"}, "legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}},
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"lineWidth": 2, "fillOpacity": 15, "gradientMode": "opacity"}, "color": {"mode": "palette-classic"}}}
        },
        {
          "id": 13,
          "title": "📋 Pod Status Overview",
          "type": "table",
          "gridPos": {"x": 0, "y": 27, "w": 14, "h": 8},
          "targets": [{"expr": "kube_pod_status_phase{namespace=\"piprojet\"}", "legendFormat": "", "instant": true, "datasource": "Prometheus", "format": "table"}],
          "options": {"sortBy": [{"desc": false, "displayName": "pod"}], "footer": {"show": false}},
          "fieldConfig": {"defaults": {"custom": {"align": "left", "displayMode": "auto"}}, "overrides": [{"matcher": {"id": "byName", "options": "Value"}, "properties": [{"id": "custom.displayMode", "value": "color-background"}, {"id": "mappings", "value": [{"options": {"0": {"color": "red", "text": "Not Running"}, "1": {"color": "green", "text": "Running"}}, "type": "value"}]}]}]}
        },
        {
          "id": 14,
          "title": "🏷️ Container Memory Limit vs Usage",
          "type": "bargauge",
          "gridPos": {"x": 14, "y": 27, "w": 10, "h": 8},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"piprojet\",container!=\"\"}) by (container) / 1024 / 1024", "legendFormat": "{{container}}", "datasource": "Prometheus"}],
          "options": {"orientation": "horizontal", "displayMode": "gradient", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "MB", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}, {"color": "orange", "value": 400}, {"color": "red", "value": 700}]}, "min": 0}}
        }
      ],
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "schemaVersion": 38,
      "version": 1
    }
---
# ============================================
# GRAFANA DEPLOYMENT
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/piprojet-dashboard.json
          volumeMounts:
            - name: datasource-config
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
            - name: alert-rules
              mountPath: /etc/grafana/provisioning/alerting
            - name: storage
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: datasource-config
          configMap:
            name: grafana-datasource
        - name: dashboard-provisioning
          configMap:
            name: grafana-dashboard-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-piprojet
            items:
              - key: piprojet-dashboard.json
                path: piprojet-dashboard.json
        - name: alert-rules
          configMap:
            name: grafana-alert-rules
            items:
              - key: alert-rules.yaml
                path: alert-rules.yaml
        - name: storage
          emptyDir: {}
---
# ============================================
# GRAFANA SERVICE
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
