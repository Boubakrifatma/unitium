apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-piprojet
  namespace: monitoring
data:
  piprojet-simple.json: |
    {
      "title": "Kubernetes Monitoring - Simple",
      "tags": ["kubernetes", "simple"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 0,
      "refresh": "30s",
      "uid": "k8s-simple",
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage by Pod",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[1m])) by (pod, namespace)",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {"calcs": ["last"], "displayMode": "table"}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {"lineWidth": 2}
            }
          }
        },
        {
          "id": 2,
          "title": "Memory Usage by Pod",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{container!=\"\"}) by (pod, namespace) / 1024 / 1024",
              "legendFormat": "{{namespace}}/{{pod}} (MB)",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {"calcs": ["last"], "displayMode": "table"}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"lineWidth": 2}
            }
          }
        },
        {
          "id": 3,
          "title": "Pod Restarts (Last 24h)",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "kube_pod_container_status_restarts_total",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true},
                "indexByName": {"pod": 0, "namespace": 1, "container": 2, "Value": 3},
                "renameByName": {
                  "pod": "Pod",
                  "namespace": "Namespace",
                  "container": "Container",
                  "Value": "Restarts"
                }
              }
            }
          ]
        },
        {
          "id": 4,
          "title": "Pod Status - Running",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": "Running",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Pod Status - Issues",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 8},
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=~\"Pending|Failed\"})",
              "legendFormat": "Issues",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": 0},
                  {"color": "red", "value": 1}
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "title": "Network I/O by Pod (RX)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{container!=\"\"}[1m])) by (pod, namespace)",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {"calcs": ["last"], "displayMode": "table"}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {"lineWidth": 1}
            }
          }
        },
        {
          "id": 7,
          "title": "Deployment Replicas Available",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true},
                "indexByName": {"deployment": 0, "namespace": 1, "Value": 2},
                "renameByName": {
                  "deployment": "Deployment",
                  "namespace": "Namespace",
                  "Value": "Available Replicas"
                }
              }
            }
          ]
        }
      ]
    }
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Kubernetes Dashboards'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
