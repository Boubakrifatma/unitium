apiVersion: apps/v1
kind: Deployment
metadata:
  name: m2-ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m2-ml-service
  template:
    metadata:
      labels:
        app: m2-ml-service
    spec:
      containers:
        - name: m2-ml-service
          image: fatmaboubakri/piprojet-ml-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "PiProjet123"
            - name: DB_USER
              value: "root"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: spring-datasource-password
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
