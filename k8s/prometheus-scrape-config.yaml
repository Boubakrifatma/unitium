apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-piprojet-scrape
  namespace: monitoring
data:
  piprojet.yml: |
    # PiProjet Application Metrics Scraping Config
    - job_name: 'piprojet-backend'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - piprojet
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: backend
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
      metrics_path: /actuator/prometheus
      scrape_interval: 30s

    - job_name: 'piprojet-ml-service'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - piprojet
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: m2-ml-service
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
      metrics_path: /metrics
      scrape_interval: 30s
