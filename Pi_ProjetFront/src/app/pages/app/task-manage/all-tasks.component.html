<div *ngIf="!dataSource.data.length" style="padding: 16px; color: gray;">
  ❌ Aucune tâche trouvée pour ce milestone.
</div>

<table mat-table [dataSource]="dataSource" matSort *ngIf="dataSource.data.length">

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Titre</th>
    <td mat-cell *matCellDef="let task">{{ task.title }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Statut</th>
    <td mat-cell *matCellDef="let task">{{ task.status }}</td>
  </ng-container>

  <ng-container matColumnDef="priority">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Priorité</th>
    <td mat-cell *matCellDef="let task">{{ task.priority }}</td>
  </ng-container>

  <ng-container matColumnDef="assignedTo">
    <th mat-header-cell *matHeaderCellDef>Assigné à</th>
    <td mat-cell *matCellDef="let task">
      {{ task.assignedTo?.name || 'Non assigné' }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
