apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-configmap
  namespace: piprojet
data:
  # Internal K8s service DNS names - always work within cluster
  ML_SERVICE_BASE_URL: "http://m2-ml-service.piprojet.svc.cluster.local:8000"
  BACKEND_URL: "http://backend.piprojet.svc.cluster.local:8084"
  FRONTEND_URL: "http://frontend.piprojet.svc.cluster.local:80"

  # CORS: Update the ngrok URL each time it changes (free plan rotates URLs).
  # To get the current ngrok URL run:
  #   kubectl exec -n piprojet deploy/ngrok -- curl -s localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
  CORS_ALLOWED_ORIGINS: "http://frontend.piprojet.svc.cluster.local,http://backend.piprojet.svc.cluster.local,http://localhost,http://localhost:80,https://venomous-smugness-ethically.ngrok-free.dev"

  # Email configuration
  SPRING_MAIL_HOST: "smtp.gmail.com"
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_USERNAME: "ca.unitumgroup1@gmail.com"

  # Billing app URL
  BILLING_APP_URL: "http://frontend.piprojet.svc.cluster.local:80"
