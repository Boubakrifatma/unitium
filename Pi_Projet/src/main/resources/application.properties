# =========================================================
# Application
# =========================================================
spring.application.name=Pi_Projet


# =========================================================
# Database (MySQL + Hibernate)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/pay?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — connection pool sizing
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Store UUID fields as char(36) instead of binary(16)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

server.error.include-message=always


# =========================================================
# Server
# =========================================================
server.port=8084


# =========================================================
# Git / GitHub Module
# =========================================================
# AES master key used to encrypt PATs at rest. CHANGE in production.
app.github.encryption-key=${GITHUB_ENC_KEY:CHANGE_ME_dev_only_pi_projet_master_key}

# Auto-launch the Python git-service (FastAPI) at boot for advanced analytics.
app.git.python.enabled=false
app.git.python.executable=python
app.git.python.script=../git-service/main.py
app.git.python.workdir=../git-service


