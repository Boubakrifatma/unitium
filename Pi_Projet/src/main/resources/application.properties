# ── Database ──────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
# Store UUID fields as char(36) strings instead of binary(16).
# Without this, Hibernate 6 + MySQL defaults to binary(16) and all raw JDBC
# queries using orgId.toString() silently return no rows — breaking quota enforcement.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.application.name=Pi_Projet
# Database URL - use environment variable or K8s service DNS
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/PiProjet123?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8084

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://localhost:80}

# ── SMTP Gmail (App Password) ──────────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:ca.unitumgroup1@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Billing App Config ─────────────────────────────────────────────────────────
billing.from-email=${BILLING_FROM_EMAIL:ca.unitumgroup1@gmail.com}
billing.from-name=${BILLING_FROM_NAME:Unitum Billing}
billing.app-url=${BILLING_APP_URL:http://frontend:80}
billing.admin-email=${BILLING_ADMIN_EMAIL:ca.unitumgroup1@gmail.com}

# ── Module 2 ML Bridge ───────────────────────────────────────────────────────
# Uses K8s service DNS (m2-ml-service) - works in any environment
ml.service.base-url=${ML_SERVICE_BASE_URL:http://m2-ml-service:8000}
ml.service.connect-timeout-ms=1200
ml.service.read-timeout-ms=3200