# Enable automatic schema creation/update
spring.jpa.hibernate.ddl-auto=update
spring.application.name=Pi_Projet
spring.datasource.url=jdbc:mysql://localhost:3306/pigit?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Port du serveur (optionnel)
server.port=8084

# File upload limits
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

# Upload directory (relative to working directory)
app.upload.dir=uploads/chat