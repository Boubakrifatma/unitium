# ── Database ──────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
# Store UUID fields as char(36) strings instead of binary(16).
# Without this, Hibernate 6 + MySQL defaults to binary(16) and all raw JDBC
# queries using orgId.toString() silently return no rows — breaking quota enforcement.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.application.name=Pi_Projet
spring.datasource.url=jdbc:mysql://localhost:3306/PiProjet123?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

