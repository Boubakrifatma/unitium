# =========================================================
# Deliverable Intelligence — Smart Keyword Detection
# Comma-separated list of keywords whose ADD/REMOVE drives
# the impact level, regression detection and highlighting.
# Edit freely without redeploying classes.
# =========================================================
intelligence.keywords=login,authentication,security,payment,password,authorization,api,database,token,encryption,ssl,tls,sécurité,paiement

# Synonyms in the form  variant>canonical , comma-separated.
# e.g. "auth>authentication" means the word "auth" in the text
# will be normalized to "authentication" before keyword matching.
intelligence.keyword.synonyms=auth>authentication,authn>authentication,authz>authorization,pwd>password,motdepasse>password,db>database,bdd>database,paiment>payment

